<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitchdeck AI - Upload Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="flex flex-col md:flex-row min-h-screen">

        <!-- Left Column: Branding (Visible on medium screens and up) -->
        <div class="hidden md:flex md:w-1/2 bg-gradient-to-b from-purple-600 to-indigo-700 text-white flex-col items-center justify-center p-12 text-center">
            <div class="max-w-md">
                <!-- Logo and App Name -->
                <div class="flex items-center justify-center gap-4 mb-4">
                    <div class="w-16 h-16">
                        <!-- SVG Logo -->
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="50" fill="white" fill-opacity="0.2"/>
                            <path d="M50 0C22.3858 0 0 22.3858 0 50H50V0Z" fill="white"/>
                        </svg>
                    </div>
                    <h1 class="text-5xl font-bold">Pitchdeck AI</h1>
                </div>
                <!-- Tagline -->
                <p class="text-2xl text-purple-200 mt-4">
                    Perfect your pitch, powered by artificial intelligence
                </p>
            </div>
        </div>

        <!-- Right Column: Upload Form (Full width on mobile, half on desktop) -->
        <div class="w-full md:w-1/2 flex items-center justify-center p-8">
            <div class="max-w-md w-full">
                
                <div class="text-center">
                     <h2 class="text-3xl font-extrabold text-gray-900">Upload Your Pitch Deck</h2>
                     <p class="mt-2 text-sm text-gray-600">Let's get started by analyzing your materials.</p>
                </div>

                <!-- File Upload Area -->
                <div class="mt-10">
                    <label for="file-upload" class="relative block w-full border-2 border-gray-300 border-dashed rounded-lg p-12 text-center hover:border-purple-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 cursor-pointer transition-colors duration-300">
                        <div class="flex flex-col items-center">
                            <!-- Upload Icon -->
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M30.07,10.21,20.25,20a1,1,0,0,1-1.41,0L15.3,16.42a1,1,0,0,0-1.41,0l-3.18,3.18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"/>
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                                <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
                                <line x1="12" y1="11" x2="12" y2="17" />
                                <polyline points="15 14 12 11 9 14" />
                            </svg>
                            <span class="mt-2 block text-sm font-medium text-gray-900">
                                Drag & Drop or Click to Upload File
                            </span>
                             <span class="mt-1 block text-xs text-gray-500">
                                PDF, PPTX
                            </span>
                        </div>
                        <input id="file-upload" name="file-upload" type="file" class="sr-only">
                    </label>
                </div>
                
                <!-- Action Buttons -->
                <div class="w-full pt-8">
                    <button id="upload-continue" type="button" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-300 disabled:bg-purple-300 disabled:cursor-not-allowed" disabled>
                        Continue
                    </button>
                    <div id="upload-status" class="mt-4 text-center text-sm"></div>
                </div>
                
                 <div class="text-center mt-4">
                     <a href="#" class="text-sm font-medium text-purple-600 hover:text-purple-500"> &larr; Back to Login</a>
                 </div>
            </div>
        </div>
    </div>

</body>
<script src="/static/app.js"></script>
<script>
let selectedFile = null;
// Pull userId from login
let userId = Number(localStorage.getItem('userId') || '0');
const fileInput = document.getElementById('file-upload');
const continueBtn = document.getElementById('upload-continue');
const statusDiv = document.getElementById('upload-status');

fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    continueBtn.disabled = !selectedFile;
    statusDiv.textContent = '';
});

continueBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    if (!userId) {
        statusDiv.textContent = 'Missing user. Please log in again.';
        window.location.href = './login.html';
        return;
    }
    statusDiv.textContent = 'Uploading...';
    try {
        const result = await uploadPitchDeck(userId, selectedFile);
        statusDiv.textContent = 'Upload successful!';
        // Store session for next steps
        if (result && result.session_id) {
            localStorage.setItem('sessionId', String(result.session_id));
        }
        // Redirect to persona selection
        window.location.href = './persona.html';
    } catch (e) {
        statusDiv.textContent = 'Upload failed: ' + e;
    }
});
</script>
</html>
